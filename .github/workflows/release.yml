name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Verify tag matches pom version
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pom version: $POM_VERSION, tag version: $TAG_VERSION"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $POM_VERSION"
            exit 1
          fi
          echo "VERSION=$POM_VERSION" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/cloudtower-java-sdk-${{ env.VERSION }}.jar
            target/cloudtower-java-sdk-${{ env.VERSION }}-sources.jar
            target/cloudtower-java-sdk-${{ env.VERSION }}-javadoc.jar
            pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
